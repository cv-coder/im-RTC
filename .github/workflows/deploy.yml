# 工作流名称
name: Deploy LWF-IM to Server

# 触发条件：当推送到 master 分支时执行
on:
  push:
    branches: [master]
  # 可选：支持手动触发
  workflow_dispatch:

# 工作流任务
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 第一步：拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 第二步：设置 JDK 17 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # 第三步：Maven 构建打包
      # 注意：prod 配置文件含数据库密码等敏感信息，不打入 jar 包，部署时单独上传覆盖
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests
          echo "Build completed successfully"

      # 第四步：配置 SSH 连接
      - name: Setup SSH connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 第五步：创建服务器目录结构（幂等，可重复执行）
      - name: Prepare server directories
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} bash << 'EOF'
            set -e
            mkdir -p /www/wwwroot/lwf-im/im-platform
            mkdir -p /www/wwwroot/lwf-im/im-server
            mkdir -p /www/wwwroot/lwf-im/logs
            mkdir -p /www/wwwroot/lwf-im/config/im-platform
            mkdir -p /www/wwwroot/lwf-im/config/im-server
          EOF

      # 第六步：上传生产配置文件
      # ⚠️  application-prod.yml 含敏感信息，请确保已加入 .gitignore，
      #     并通过 GitHub Secrets 或此处直接 scp 的方式管理
      - name: Deploy prod config files
        run: |
          scp -o StrictHostKeyChecking=no \
            im-platform/src/main/resources/application-prod.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/www/wwwroot/lwf-im/config/im-platform/application-prod.yml

          scp -o StrictHostKeyChecking=no \
            im-server/src/main/resources/application-prod.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/www/wwwroot/lwf-im/config/im-server/application-prod.yml

          echo "prod config files deployed"

      # 第七步：上传 jar 包
      - name: Deploy jars
        run: |
          scp -o StrictHostKeyChecking=no \
            im-platform/target/im-platform.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/www/wwwroot/lwf-im/im-platform/im-platform.jar

          scp -o StrictHostKeyChecking=no \
            im-server/target/im-server.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/www/wwwroot/lwf-im/im-server/im-server.jar

          echo "jars deployed"

      # 第八步：重启服务
      # 修复点1：heredoc 内不能有前置空格，否则 << 'EOF' 无法识别结束标记导致 ssh 挂起
      # 修复点2：nohup 后台进程用 disown 彻底脱离 ssh 会话，避免 ssh 退出时 SIGHUP 杀死子进程
      # 修复点3：启动命令只需 --spring.profiles.active=prod，Spring Boot 会自动加载
      #          jar 外同目录的 application-prod.yml（Spring Boot 外部配置优先级规则）
      - name: Restart services
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} bash << 'EOF'
            set -e

            PID_DIR=/www/wwwroot/lwf-im/pids
            mkdir -p "$PID_DIR"

            # 通过 pid 文件停止旧服务，避免 pkill 跨用户权限问题
            for SVC in im-platform im-server; do
              PID_FILE="$PID_DIR/$SVC.pid"
              if [ -f "$PID_FILE" ]; then
                OLD_PID=$(cat "$PID_FILE")
                if kill -0 "$OLD_PID" 2>/dev/null; then
                  echo "Stopping $SVC (pid=$OLD_PID)..."
                  kill "$OLD_PID"
                  # 等待进程真正退出（最多 15 秒）
                  for i in $(seq 1 15); do
                    kill -0 "$OLD_PID" 2>/dev/null || break
                    sleep 1
                  done
                  # 仍未退出则强杀
                  kill -0 "$OLD_PID" 2>/dev/null && kill -9 "$OLD_PID" || true
                fi
                rm -f "$PID_FILE"
              fi
            done

            # 启动 im-platform，记录 pid
            nohup java -jar /www/wwwroot/lwf-im/im-platform/im-platform.jar \
              --spring.profiles.active=prod \
              --spring.config.additional-location=file:/www/wwwroot/lwf-im/config/im-platform/ \
              > /www/wwwroot/lwf-im/logs/im-platform.log 2>&1 &
            echo $! > "$PID_DIR/im-platform.pid"
            disown

            sleep 8

            # 启动 im-server，记录 pid
            nohup java -jar /www/wwwroot/lwf-im/im-server/im-server.jar \
              --spring.profiles.active=prod \
              --spring.config.additional-location=file:/www/wwwroot/lwf-im/config/im-server/ \
              > /www/wwwroot/lwf-im/logs/im-server.log 2>&1 &
            echo $! > "$PID_DIR/im-server.pid"
            disown

            echo "Services restarted (platform pid=$(cat $PID_DIR/im-platform.pid), server pid=$(cat $PID_DIR/im-server.pid))"
          EOF

      # 第九步：健康检查（等待足够时间让 Spring Boot 完成启动）
      - name: Health check
        run: |
          sleep 20
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} bash << 'EOF'
            echo "=== Process check ==="
            ps aux | grep -E 'im-(platform|server)\.jar' | grep -v grep \
              && echo "✅ Services are running" \
              || echo "❌ WARNING: Services may not be running"

            echo "=== im-platform log tail ==="
            tail -20 /www/wwwroot/lwf-im/logs/im-platform.log || true

            echo "=== im-server log tail ==="
            tail -20 /www/wwwroot/lwf-im/logs/im-server.log || true
          EOF

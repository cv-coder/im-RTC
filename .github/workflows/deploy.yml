# 工作流名称
name: Deploy LWF-IM to Server

# 触发条件：当推送到 master 分支时执行
on:
  push:
    branches: [master]
  # 可选：支持手动触发
  workflow_dispatch:

# 工作流任务
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 第一步：拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 第二步：设置 JDK 17 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # 第三步：Maven 构建打包
      # 注意：prod 配置文件含数据库密码等敏感信息，不打入 jar 包，部署时单独上传覆盖
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests
          echo "Build completed successfully"

      # 第四步：配置 SSH 连接
      - name: Setup SSH connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 第五步：创建服务器目录结构（幂等，可重复执行）
      - name: Prepare server directories
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} bash << 'EOF'
            set -e
            mkdir -p /www/wwwroot/lwf-im/im-platform
            mkdir -p /www/wwwroot/lwf-im/im-server
            mkdir -p /www/wwwroot/lwf-im/logs
            mkdir -p /www/wwwroot/lwf-im/config/im-platform
            mkdir -p /www/wwwroot/lwf-im/config/im-server
          EOF

      # 第六步：上传生产配置文件
      # ⚠️  application-prod.yml 含敏感信息，请确保已加入 .gitignore，
      #     并通过 GitHub Secrets 或此处直接 scp 的方式管理
      - name: Deploy prod config files
        run: |
          scp -o StrictHostKeyChecking=no \
            im-platform/src/main/resources/application-prod.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/www/wwwroot/lwf-im/config/im-platform/application-prod.yml

          scp -o StrictHostKeyChecking=no \
            im-server/src/main/resources/application-prod.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/www/wwwroot/lwf-im/config/im-server/application-prod.yml

          echo "prod config files deployed"

      # 第七步：上传 jar 包
      - name: Deploy jars
        run: |
          scp -o StrictHostKeyChecking=no \
            im-platform/target/im-platform.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/www/wwwroot/lwf-im/im-platform/im-platform.jar

          scp -o StrictHostKeyChecking=no \
            im-server/target/im-server.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/www/wwwroot/lwf-im/im-server/im-server.jar

          echo "jars deployed"

      # 第八步：检查服务器 systemd 与 sudo 权限
      - name: Preflight systemd
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} bash << 'EOF'
            set -e
            command -v systemctl >/dev/null
            sudo -n systemctl --version >/dev/null
            echo "systemd and sudo checks passed"
          EOF

      # 第九步：上传 systemd unit 文件
      - name: Upload systemd unit files
        run: |
          scp -o StrictHostKeyChecking=no \
            .github/workflows/systemd/im-platform.service \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/im-platform.service

          scp -o StrictHostKeyChecking=no \
            .github/workflows/systemd/im-server.service \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/im-server.service

      # 第十步：安装 unit 并重启服务
      - name: Install units and restart services
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} bash << 'EOF'
            set -e
            sudo install -m 644 /tmp/im-platform.service /etc/systemd/system/im-platform.service
            sudo install -m 644 /tmp/im-server.service /etc/systemd/system/im-server.service
            sudo systemctl daemon-reload
            sudo systemctl enable im-platform im-server
            sudo systemctl restart im-platform
            sleep 3
            sudo systemctl restart im-server
            sudo systemctl show im-platform -p MainPID
            sudo systemctl show im-server -p MainPID
          EOF

      # 第十一步：健康检查
      - name: Health check
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} bash << 'EOF'
            set -e

            sudo systemctl is-active --quiet im-platform
            sudo systemctl is-active --quiet im-server

            echo "=== im-platform status ==="
            sudo systemctl status im-platform --no-pager
            echo "=== im-server status ==="
            sudo systemctl status im-server --no-pager

            echo "=== im-platform recent log ==="
            sudo journalctl -u im-platform -n 80 --no-pager
            echo "=== im-server recent log ==="
            sudo journalctl -u im-server -n 80 --no-pager
          EOF

      # 第十二步：失败时输出日志辅助排查
      - name: Collect failure logs
        if: failure()
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} bash << 'EOF'
            echo "=== im-platform status (failure) ==="
            sudo systemctl status im-platform --no-pager || true
            echo "=== im-server status (failure) ==="
            sudo systemctl status im-server --no-pager || true
            echo "=== im-platform journal (failure) ==="
            sudo journalctl -u im-platform -n 120 --no-pager || true
            echo "=== im-server journal (failure) ==="
            sudo journalctl -u im-server -n 120 --no-pager || true
          EOF

      # 第十三步：保留文件日志尾部输出（兼容历史排查习惯）
      - name: Tail file logs
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} bash << 'EOF'
            echo "=== im-platform file log tail ==="
            tail -20 /www/wwwroot/lwf-im/logs/im-platform.log || true
            echo "=== im-server file log tail ==="
            tail -20 /www/wwwroot/lwf-im/logs/im-server.log || true
          EOF
